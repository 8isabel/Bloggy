<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloggy</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <script src="scripts/login.js" defer></script>
</head>
<body>
    <header>
        <h1>Bloggy</h1>
        <a id="home" href="index.html">Home</a>
        <a id="create" href="add.html">+</a>
        <button type="button" id="login">Login</button>
    </header>
    <div id="main">
        <div id="reclame1">
            <a href="https://www.pornhub.com">
            <img src="assets/kattenvoer-reclame.png" alt="kattenvoer-reclame" width="280px">
                </a>
        </div>
        <div id="Search">
            <div id="sorting">
                <input type="text" id="searchInput" placeholder="Search...">
                <select id="sort">
                    <option value="scary">Scary</option>
                    <option value="news">News</option>
                    <option value="fun">Fun</option>
                </select>
            </div>
            <div id="blogPosts">
                <div class="blog-post">
                    <div class="blog-post-left">
                        <img class="blog-foto">
                        <div>
                            <h2>Blog Post Title</h2>
                            <p>Author: John Doe</p>
                            <p>Date: 2024-06-15</p>
                            <p>Category: News</p>
                        </div>
                    </div>
                    <div class="blog-post-right">
                        <p>Blog post content goes here...</p>
                        <button>Read More...</button>
                    </div>
                </div>
                <div class="blog-post">
                    <div class="blog-post-left">
                        <img class="blog-foto">
                        <div>
                            <h2>Blog Post Title</h2>
                            <p>Author: John Doe</p>
                            <p>Date: 2024-06-15</p>
                            <p>Category: News</p>
                        </div>
                    </div>
                    <div class="blog-post-right">
                        <p>Blog post content goes here...</p>
                        <button>Read More...</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="reclame2">
            <a href="https://www.pornhub.com">
            <img src="assets/kattenvoer-reclame.png" alt="kattenvoer-reclame" width="280px">
                </a>
        </div>
    </div>

    <div id="loginModal" class="login-modal" aria-hidden="true">
        <div class="login-box" role="dialog" aria-labelledby="loginTitle">
            <button type="button" class="login-close" id="loginClose" aria-label="Close">&times;</button>
            <h2 id="loginTitle">Login</h2>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
