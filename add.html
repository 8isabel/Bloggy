<!DOCTYPE html>

<header>
        <h1>Bloggy</h1>
        <a id="home" href="index.php">Home</a>
        <a id="create" href="add.html">+</a>
        <button type="button" id="login">Login</button>
    </header>
    <main>
        <div class="left">
            <h3>Edit</h3>
            <div class="edit">
                <button id="landscape" class="active">Landscape</button>
                <button id="portrait">Portrait</button>
                <button id="panorama">Panorama</button>
                <button id="boomerang">Boomerang</button>
            </div>
            <div class="settings">
                <h3>Settings</h3>
                                        <div class="group">
                    <label for="sort">Sort</label>
                    <select name="sort" id="sort">
                    <option value="scary">Scary</option>
                    <option value="news">News</option>
                    <option value="fun">Fun</option>
                </select>
                <label for="Author">Autheur</label>
                        <input type="text" name="author">
                </div>
            </div>
        </div>
        <div class="blog">
            <div class="right">
                <div class="landscape">
                    <h4>Landscape Preview</h4>
                    <div class="create-form">
                        <div class="group"> 
                        <label for="title">Titel</label>
                        <input name="title" type="text">
                        </div>
                <input type="file">
                <div class="group">
                        <label for="text">Tekst</label>
                        <textarea name="Tekst" type="text"></textarea>
                    </div>
                    <input type="file">
                    </div>

                    
                </div>
                <div class="portrait hidden">
                    <h4>Portrait Preview</h4>
                </div>
                <div class="panorama hidden">
                    <h4>Panorama Preview</h4>
                </div>
                <div class="boomerang hidden">
                    <h4>Boomerang Preview</h4>
                </div>
            </div>
        </div>
        <button class="post-btn" id="post">Post</button>
    </main>

    <div id="loginModal" class="login-modal" aria-hidden="true">
        <div class="login-box" role="dialog" aria-labelledby="loginTitle">
            <button type="button" class="login-close" id="loginClose" aria-label="Close">&times;</button>
            <h2 id="loginTitle">Login</h2>
            <form id="loginForm">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required>
                <button type="submit">Login</button>
            </form>
        </div>
        
    </div>
